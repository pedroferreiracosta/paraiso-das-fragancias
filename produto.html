<script>
/* Renderizador leve dos templates do protótipo: {{campos}}, <sc-for>, <sc-if> e eventos. */
(function () {
  function resolve(expr, scope) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    var parts = expr.split('.');
    var cur = scope;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  var HOLE = /\{\{([^}]+)\}\}/g;
  function fill(str, scope) {
    return str.replace(HOLE, function (_, e) {
      var v = resolve(e, scope);
      return v == null ? '' : String(v);
    });
  }
  function single(str) {
    var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str);
    return m ? m[1] : null;
  }
  function processNode(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(fill(node.nodeValue, scope)));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var list = resolve(single(node.getAttribute('list')) || '', scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, idx) {
        var s = Object.create(scope);
        s[as] = item;
        s[as + 'Index'] = idx;
        node.childNodes.forEach(function (c) { processNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      var expr = single(node.getAttribute('value') || '');
      if (expr && resolve(expr, scope)) {
        node.childNodes.forEach(function (c) { processNode(c, scope, out); });
      }
      return;
    }
    var ns = node.namespaceURI;
    var el = ns && ns !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(ns, node.tagName) : document.createElement(node.tagName);
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i];
      var name = a.name;
      if (name.indexOf('hint-') === 0) continue;
      var e1 = single(a.value);
      if (/^on/i.test(name) && e1) {
        var fn = resolve(e1, scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      var v = fill(a.value, scope);
      if (a.namespaceURI) el.setAttributeNS(a.namespaceURI, name, v); else el.setAttribute(name, v);
    }
    var src = tag === 'template' ? node.content : node;
    src.childNodes.forEach(function (c) { processNode(c, scope, el); });
    out.appendChild(el);
  }
  window.DCLogic = function DCLogic() { this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    this.state = Object.assign({}, this.state || {}, patch);
    render();
  };
  var comp = null;
  function render() {
    var tpl = document.getElementById('tpl');
    var root = document.getElementById('root');
    var vals = comp && comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach(function (c) { processNode(c, vals, frag); });
    root.replaceChildren(frag);
  }
  window.__mount = function (Cls) {
    comp = new Cls();
    if (!comp.state) comp.state = {};
    render();
  };
})();

</script>
<script>
class Component extends DCLogic {
  imgs() {
    return {
      g_decant: 'img/g_decant.webp', g_frasco: 'img/g_frasco.webp', g_rotulo: 'img/g_rotulo.webp', g_lacre: 'img/g_lacre.webp',
      d_atheeri: 'img/d_atheeri.webp', d_musamam: 'img/d_musamam.webp', d_maleka: 'img/d_maleka.webp', s_yara: 'img/s_yara.webp'
    };
  }
  openState() {
    var base = { cheiro: true, piramide: true, uso: false, decant: false, original: false, entrega: false };
    var st = this.state || {};
    return Object.assign({}, base, st.open || {});
  }
  toggle(key) {
    var cur = this.openState();
    cur[key] = !cur[key];
    this.setState({ open: cur });
  }
  renderVals() {
    var self = this;
    var I = this.imgs();
    var st = this.state || {};
    var vol = st.vol || '5';
    var thumb = typeof st.thumb === 'number' ? st.thumb : 0;
    var base = [
      { id: '2', label: '2 ml', spr: 'cerca de 28 borrifadas', price: 'R$ 34,90', pix: 'R$ 33,16', note: '' },
      { id: '5', label: '5 ml', spr: 'cerca de 75 borrifadas', price: 'R$ 54,90', pix: 'R$ 52,16', note: '' },
      { id: '10', label: '10 ml', spr: 'cerca de 130 borrifadas', price: 'R$ 85,90', pix: 'R$ 81,61', note: 'Última unidade' }
    ];
    var sel = base.filter(function (v) { return v.id === vol; })[0] || base[1];
    var variants = base.map(function (v) {
      var on = v.id === vol;
      return Object.assign({}, v, {
        pick: function () { self.setState({ vol: v.id }); },
        pressed: on ? 'true' : 'false',
        bg: on ? '#551516' : '#F6F1EA',
        fg: on ? '#F6F1EA' : '#2B1A19',
        sub: on ? '#E3D3C1' : '#6B5A55',
        border: on ? '#551516' : '#D9CBBB',
        hasNote: !!v.note
      });
    });
    var g = {
      show0: thumb === 0, show1: thumb === 1, show2: thumb === 2, show3: thumb === 3,
      p0: thumb === 0 ? 'true' : 'false', p1: thumb === 1 ? 'true' : 'false', p2: thumb === 2 ? 'true' : 'false', p3: thumb === 3 ? 'true' : 'false',
      b0: thumb === 0 ? '#551516' : '#D9CBBB', b1: thumb === 1 ? '#551516' : '#D9CBBB', b2: thumb === 2 ? '#551516' : '#D9CBBB', b3: thumb === 3 ? '#551516' : '#D9CBBB',
      pick0: function () { self.setState({ thumb: 0 }); },
      pick1: function () { self.setState({ thumb: 1 }); },
      pick2: function () { self.setState({ thumb: 2 }); },
      pick3: function () { self.setState({ thumb: 3 }); }
    };
    var open = this.openState();
    var rot = {};
    Object.keys(open).forEach(function (k) { rot[k] = open[k] ? 180 : 0; });
    var toggles = {
      cheiro: function () { self.toggle('cheiro'); },
      piramide: function () { self.toggle('piramide'); },
      uso: function () { self.toggle('uso'); },
      decant: function () { self.toggle('decant'); },
      original: function () { self.toggle('original'); },
      entrega: function () { self.toggle('entrega'); }
    };
    var related = [
      { brand: 'Lattafa', name: 'Decant Atheeri Eau de Parfum', priceLine: 'a partir de R$ 40,00', pix: 'R$ 38,00', img: I.d_atheeri },
      { brand: 'Lattafa', name: 'Decant Musamam White Intense', priceLine: 'a partir de R$ 35,00', pix: 'R$ 33,25', img: I.d_musamam },
      { brand: 'Armaf', name: 'Decant Club de Nuit Maleka', priceLine: 'a partir de R$ 35,90', pix: 'R$ 34,11', img: I.d_maleka },
      { brand: 'Lattafa', name: 'Body Mist Yara 250ml', priceLine: 'R$ 129,90', pix: 'R$ 123,41', img: I.s_yara }
    ];
    return { img: I, sel: sel, variants: variants, g: g, open: open, rot: rot, toggles: toggles, related: related };
  }
}
window.__mount(Component);
</script>
