<script>
/* Renderizador leve dos templates do protótipo: {{campos}}, <sc-for>, <sc-if> e eventos. */
(function () {
  function resolve(expr, scope) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    var parts = expr.split('.');
    var cur = scope;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  var HOLE = /\{\{([^}]+)\}\}/g;
  function fill(str, scope) {
    return str.replace(HOLE, function (_, e) {
      var v = resolve(e, scope);
      return v == null ? '' : String(v);
    });
  }
  function single(str) {
    var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str);
    return m ? m[1] : null;
  }
  function processNode(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(fill(node.nodeValue, scope)));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var list = resolve(single(node.getAttribute('list')) || '', scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, idx) {
        var s = Object.create(scope);
        s[as] = item;
        s[as + 'Index'] = idx;
        node.childNodes.forEach(function (c) { processNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      var expr = single(node.getAttribute('value') || '');
      if (expr && resolve(expr, scope)) {
        node.childNodes.forEach(function (c) { processNode(c, scope, out); });
      }
      return;
    }
    var ns = node.namespaceURI;
    var el = ns && ns !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(ns, node.tagName) : document.createElement(node.tagName);
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i];
      var name = a.name;
      if (name.indexOf('hint-') === 0) continue;
      var e1 = single(a.value);
      if (/^on/i.test(name) && e1) {
        var fn = resolve(e1, scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      var v = fill(a.value, scope);
      if (a.namespaceURI) el.setAttributeNS(a.namespaceURI, name, v); else el.setAttribute(name, v);
    }
    var src = tag === 'template' ? node.content : node;
    src.childNodes.forEach(function (c) { processNode(c, scope, el); });

  }
  window.DCLogic = function DCLogic() { this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    this.state = Object.assign({}, this.state || {}, patch);
    render();
  };
  var comp = null;
  function render() {
    var tpl = document.getElementById('tpl');
    var root = document.getElementById('root');
    var vals = comp && comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach(function (c) { processNode(c, vals, frag); });
    root.replaceChildren(frag);
  }
  window.__mount = function (Cls) {
    comp = new Cls();
    if (!comp.state) comp.state = {};
    render();
  };
})();

</script>
